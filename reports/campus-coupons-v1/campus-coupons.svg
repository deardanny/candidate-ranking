  <g id="text_24">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #4c535b" transform="translate(27.72 343.296)">Points: differences in user means. Bars: 95% user-bootstrap intervals, conditional on the invented simulator.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #4c535b" transform="translate(27.72 357.696)">The same cohort is reused across conditions. No human participants, real purchases or LLM respondent calls.</text>
